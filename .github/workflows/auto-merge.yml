name: Auto Merge PRs with label
on:
  pull_request:
    types: [labeled, opened, synchronize]

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'main'   # only auto-merge into main; change if you need a different branch
    steps:
      - name: Finish if label not present
        id: check_label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name);
            return labels.includes('automerge');
      - name: Stop if not labeled
        if: steps.check_label.outputs.result != 'true'
        run: |
          echo "PR not labeled 'automerge' - skipping"
          exit 0
      - name: Wait for required checks to succeed
        uses: actions/github-script@v7
        id: wait_checks
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = pr.head.sha;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            for (let i=0; i<40; i++) {
              const { data: combined } = await github.repos.getCombinedStatusForRef({ owner, repo, ref });
              if (combined.state === 'success' || combined.state === 'neutral') {
                return 'ready';
              }
              console.log(`Status: ${combined.state}; waiting 15s...`);
              await sleep(15000);
            }
            throw new Error('Required status checks did not reach success in time');
      - name: Merge the PR
        uses: peter-evans/merge@v4
        with:
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash          # choose merge, squash, or rebase
          commit-title: 'Auto-merged PR #${{ github.event.pull_request.number }}'
          github-token: ${{ secrets.GITHUB_TOKEN }}
