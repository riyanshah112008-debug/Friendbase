name: Auto Commit (create PR)
on:
  workflow_dispatch:     # manual run from Actions tab
  schedule:
    - cron: '0 3 * * *'  # optional: run daily at 03:00 UTC (edit as you like)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci --omit=dev --legacy-peer-deps
      - name: Run automatic fixes (example)
        run: |
          # example automatic step - adjust for your repo
          npm audit fix || true
          # run formatters or other tasks that may modify files
          # npx prettier -u "**/*.js" || true
      - name: Show git status
        run: |
          git status --porcelain
          git --no-pager diff --name-only || true
      - name: Create branch and PR if changes
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: chore(auto): automated fixes
          branch: auto/automated-fixes-${{ github.run_id }}
          title: chore(auto): automated fixes
          body: This PR contains automated dependency/formatting fixes created by the CI.
          labels: automated, ci
